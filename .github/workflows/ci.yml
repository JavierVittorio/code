name: ci
on: [push, pull_request]
jobs:
  test-and-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements-dev.txt
      - name: unit tests
        run: pytest -q
      - name: metric stability (re-score committed baseline; no API calls)
        run: python -m eval.ci_check
      - name: regression gate (committed candidate vs baseline, if a candidate run is committed)
        run: |
          if [ -f outputs/CANDIDATE ]; then
            python -m eval.compare "outputs/runs/$(cat outputs/BASELINE)" "outputs/runs/$(cat outputs/CANDIDATE)"
          fi
